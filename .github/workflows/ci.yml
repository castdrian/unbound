name: Client CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: client-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install
      - run: bun run fmt:check
      - run: bun run lint
      - run: bun test --path-ignore-patterns 'packages/plugins/**' --path-ignore-patterns 'packages/client/tests/native.test.ts'
      - run: bun test --isolate packages/client/tests/native.test.ts
      - run: bun run generate-sdk
      # Releases replace the generated `<version>-<hash>` with the plain release version.
      - run: |
          git diff --exit-code -I '^\s*"version": ' -- packages/api/src packages/api/package.json
      - run: bun run --cwd packages/client build
